name: Deploy lsquarem.com (Pages)

# Builds the unified site that lives at lsquarem.com:
#   - /        marketing landing — the static HTML/CSS/JS in `docs/`
#   - /docs/   product documentation — the VitePress build under `apps/docs/`
#   - /demo/   the static live demo — `apps/web` built with `--mode demo`: the
#              real studio against an in-browser fake API serving recorded
#              fixtures (apps/web/src/demo/), no server and no network
#
# The three parts are merged into a single artifact and deployed via
# actions/deploy-pages. To enable, in GitHub Settings → Pages flip the
# source from "Deploy from a branch" to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "apps/docs/**"
      # The demo at /demo/ is the studio itself (apps/web) built against recorded
      # fixtures, and it bundles the shared schemas and node definitions
      # (packages/shared/src). Sample workflows are what its templates and
      # fixtures are made from. A change to any of these changes the demo.
      - "packages/shared/src/**"
      - "apps/web/**"
      - "samples/workflows/**"
      - "scripts/assemble-pages-site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VitePress (with base=/docs/)
        run: pnpm --filter @ai-orchestrator/docs build

      # A broken demo must not take the landing page and the docs down with it:
      # the site deploys without /demo/ and the run shows a warning.
      - name: Build the live demo (with base=/demo/)
        id: demo
        continue-on-error: true
        run: pnpm --filter @ai-orchestrator/web build:demo

      # Landing at /, docs at /docs/, and the demo at /demo/ when it built.
      # The landing, the docs and the CNAME check stay required.
      - name: Assemble unified site
        env:
          DEMO_OUTCOME: ${{ steps.demo.outcome }}
        run: |
          set -euo pipefail
          node scripts/assemble-pages-site.mjs
          echo "Built _site:"
          ls -la _site
          echo "Built _site/docs:"
          ls -la _site/docs | head -10

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
