name: Release Container Images

# Build + push API and Web Docker images to GHCR when a release tag is pushed.
#
# Tag format: v<semver>, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
#
# Each tagged release publishes:
#   - ghcr.io/tensorgreed/ai-orchestrator:<tag>     (the API image)
#   - ghcr.io/tensorgreed/ai-orchestrator:latest
#   - ghcr.io/tensorgreed/ai-orchestrator-web:<tag> (the Web/Studio image)
#   - ghcr.io/tensorgreed/ai-orchestrator-web:latest
#
# Both images are built for linux/amd64 + linux/arm64 so M-series Macs and
# AWS Graviton nodes pull the right architecture without emulation. Build
# cache is backed by GHA's cache service (cache-from / cache-to: gha).
#
# Required GitHub repo settings:
#   - Settings → Actions → General → Workflow permissions → "Read and write"
#   - The default GITHUB_TOKEN is auto-issued by Actions; no PAT needed.

on:
  push:
    tags:
      - "v*"
  # Manual trigger with a custom tag — useful for back-publishing or testing.
  workflow_dispatch:
    inputs:
      tag:
        description: "Override tag to publish (defaults to git tag)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  api:
    name: Build + push API image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          REF_TAG="${GITHUB_REF_NAME}"
          TAG="${INPUT_TAG:-$REF_TAG}"
          echo "release=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tensorgreed/ai-orchestrator:${{ steps.tags.outputs.release }}
            ghcr.io/tensorgreed/ai-orchestrator:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.release }}
            org.opencontainers.image.title=l2m-api
            org.opencontainers.image.description=L2M Fastify API
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  web:
    name: Build + push Web image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          REF_TAG="${GITHUB_REF_NAME}"
          TAG="${INPUT_TAG:-$REF_TAG}"
          echo "release=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tensorgreed/ai-orchestrator-web:${{ steps.tags.outputs.release }}
            ghcr.io/tensorgreed/ai-orchestrator-web:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.release }}
            org.opencontainers.image.title=l2m-web
            org.opencontainers.image.description=L2M Studio web UI (Nginx)
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
