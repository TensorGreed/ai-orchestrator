name: Feature request
description: Propose a feature or enhancement.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature issue, please scan [the GA roadmap](https://github.com/TensorGreed/ai-orchestrator/blob/main/.github/ROADMAP_BOARD.md) — your feature may already be planned (or explicitly out of scope).

        **For larger changes, please open a [Discussion](https://github.com/TensorGreed/ai-orchestrator/discussions) first.** A 600-line PR for a feature we hadn't agreed on is painful for everyone.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user-facing problem, not the implementation. "I can't do X" is more useful than "we should add Y".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work? Sketch the API, the UI, or the workflow JSON if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing nodes, workarounds, or third-party tools you've already tried.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - MCP integration
        - Agent runtime / Swarm
        - VS Code extension
        - Workflow editor (canvas / NodeConfigModal)
        - New node type
        - New connector / provider / MCP adapter
        - API endpoint
        - Auth / RBAC / secrets
        - Observability (metrics / tracing / logs)
        - Helm / Docker / deployment
        - Docs / samples
        - Other
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Where should this live?
      description: Generic SaaS connectors usually belong in a community `l2m-nodes-*` package rather than in-tree. See [CONTRIBUTING](../../CONTRIBUTING.md).
      options:
        - In-tree (touches the niche — MCP / Swarm / agent runtime / VS Code)
        - Community node package (generic SaaS / CRUD connector)
        - Not sure — would like to discuss
    validations:
      required: true

  - type: checkboxes
    id: prereqs
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched [existing issues](https://github.com/TensorGreed/ai-orchestrator/issues?q=is%3Aissue) and didn't find a duplicate.
          required: true
        - label: I checked the [GA roadmap](https://github.com/TensorGreed/ai-orchestrator/blob/main/.github/ROADMAP_BOARD.md) and this isn't already planned.
          required: true
