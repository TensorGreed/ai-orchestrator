<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Source of docs/assets/social-card.png, the lsquarem.com share card (1200×630).
    Render it with `node scripts/social-card/render.mjs`. Paths are relative to this file;
    fonts and the screenshot come from the landing's own assets.
  -->
  <defs>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../../docs/assets/fonts/inter-latin-var.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../../docs/assets/fonts/jetbrains-mono-latin-var.woff2") format("woff2");
        font-weight: 100 800;
      }
      .sans { font-family: "Inter", sans-serif; }
      .mono { font-family: "JetBrains Mono", monospace; }
    </style>
    <radialGradient id="glow" cx="62%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#0e1422" />
      <stop offset="60%" stop-color="#07090f" />
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ae2ff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#8ae2ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18c8b2" />
      <stop offset="100%" stop-color="#17bca9" />
    </linearGradient>
    <clipPath id="frame">
      <rect x="620" y="90" width="660" height="478" rx="18" />
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)" />
  <ellipse cx="930" cy="330" rx="430" ry="330" fill="url(#halo)" />

  <!-- The studio, framed like the landing's screenshots and cut off by the right edge. -->
  <g filter="url(#shadow)">
    <rect x="620" y="90" width="660" height="478" rx="18" fill="#0d111a" />
  </g>
  <image x="620" y="90" width="765" height="478" preserveAspectRatio="xMinYMin slice" clip-path="url(#frame)" href="../../docs/assets/screens/studio-run.webp" />
  <rect x="620.5" y="90.5" width="659" height="477" rx="18" fill="none" stroke="#2a3344" />

  <text x="64" y="88" class="mono" font-size="19" font-weight="500" letter-spacing="3.5" fill="#8ae2ff">OPEN SOURCE · SELF-HOSTED</text>
  <text class="sans" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#e9ecf3">
    <tspan x="62" y="170">Run and govern</tspan>
    <tspan x="62" y="246" fill="#8ae2ff">MCP agents</tspan><tspan fill="#e9ecf3">.</tspan>
  </text>
  <text class="sans" font-size="24" font-weight="400" fill="#9aa3b5">
    <tspan x="64" y="314">Visual studio, MCP control plane, approvals,</tspan>
    <tspan x="64" y="348">signed audit bundles and release gates.</tspan>
  </text>

  <!-- Brand: the mark, the name and the address. -->
  <g transform="translate(64 528) scale(0.04297)">
    <rect width="1024" height="1024" rx="96" fill="#f2f2f2" />
    <g fill="none" stroke="url(#mark)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
      <path d="M262 332 L500 94 Q540 56 578 92" />
      <path d="M262 522 L560 224" />
      <path d="M262 742 Q226 778 262 814" />
      <path d="M454 742 L724 472 Q760 436 796 472" />
      <path d="M454 932 L760 626" />
      <path d="M698 124 Q740 90 776 124 Q802 146 790 180" />
    </g>
  </g>
  <text x="124" y="561" class="sans" font-size="32" font-weight="700" fill="#e9ecf3">L²M</text>
  <text x="204" y="559" class="mono" font-size="21" fill="#9aa3b5">lsquarem.com</text>
</svg>
