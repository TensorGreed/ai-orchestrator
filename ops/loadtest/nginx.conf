## Balancer for docker-compose.scale.yml: plain round-robin across the two API replicas, no stickiness, so every
## request may land on either replica. Same upstream style as ops/nginx/ai-orchestrator.conf.
##
## Failed requests are retried on the other replica only for idempotent methods (the nginx default): a POST that
## reached a replica is never sent twice, so a webhook or /enqueue is never duplicated by the balancer.

upstream l2m_api {
    server l2m-scale-api-1:4000 max_fails=1 fail_timeout=5s;
    server l2m-scale-api-2:4000 max_fails=1 fail_timeout=5s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location / {
        proxy_pass         http://l2m_api;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
